name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check:js
      - name: Build site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://havlick7.github.io/homeolka/' }}
          PREVIEW: ${{ vars.SITE_URL == 'https://www.homeolka.cz/' && 'false' || 'true' }}
      - run: npm run check:site
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
